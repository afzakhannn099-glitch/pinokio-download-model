\f0\fs24 \cf0 name: download-huggingface-model\
display_name: Download Hugging Face Model (Offline Setup)\
description: >\
  Automatically downloads a Hugging Face model and stores it locally\
  for offline use inside your Pinokio workspace.\
version: "1.0"\
\
# These are the commands Pinokio will run automatically\
commands:\
  # 1. Install dependencies\
  - pip install huggingface_hub\
\
  # 2. Download the model from Hugging Face to the local folder\
  - python -c "from huggingface_hub import snapshot_download; snapshot_download('runwayml/stable-diffusion-inpainting', local_dir='./models/stable_diffusion_inpaint', local_dir_use_symlinks=False)"\
\
# Optional resource limits\
resources:\
  cpu: 2\
  gpu: 1\
\
# Pinokio directory structure\
paths:\
  working_dir: ./huggingface_downloader\
}